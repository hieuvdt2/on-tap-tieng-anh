services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: english
      POSTGRES_PASSWORD: english
      POSTGRES_DB: english
    ports:
      - "5433:5432"
    volumes:
      - english_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english -d english"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  english_pg:
